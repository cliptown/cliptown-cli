name: CLI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: cliptown-cli
      - uses: actions/checkout@v4
        with:
          repository: cliptown/cliptown-clients
          ref: main
          path: cliptown-clients
      - uses: actions/checkout@v4
        with:
          repository: cliptown/cliptown-interfaces
          ref: main
          path: cliptown-interfaces
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux clipboard and keyring headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libsecret-1-dev
      - name: Verify locked dependency graph
        id: metadata
        continue-on-error: true
        shell: bash
        working-directory: cliptown-cli
        run: cargo metadata --locked --format-version 1 --no-deps > metadata-${{ runner.os }}.txt 2>&1
      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-metadata-${{ runner.os }}
          path: cliptown-cli/metadata-${{ runner.os }}.txt
          if-no-files-found: error
      - name: Enforce locked dependency graph
        if: steps.metadata.outcome == 'failure'
        shell: bash
        working-directory: cliptown-cli
        run: cat metadata-${{ runner.os }}.txt && exit 1
      - name: Check formatting
        working-directory: cliptown-cli
        run: cargo fmt --check
      - name: Run Clippy
        id: clippy
        continue-on-error: true
        shell: bash
        working-directory: cliptown-cli
        run: cargo clippy --locked --all-targets --message-format=short -- -D warnings > clippy-${{ runner.os }}.txt 2>&1
      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-clippy-${{ runner.os }}
          path: cliptown-cli/clippy-${{ runner.os }}.txt
          if-no-files-found: error
      - name: Enforce Clippy result
        if: steps.clippy.outcome == 'failure'
        shell: bash
        working-directory: cliptown-cli
        run: cat clippy-${{ runner.os }}.txt && exit 1
      - name: Run all-target tests
        working-directory: cliptown-cli
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --locked --all-targets -- --nocapture
      - name: Build release binary
        working-directory: cliptown-cli
        run: cargo build --locked --release

  flags-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned flags2env
        run: ./scripts/install-flags2env.sh
      - name: Audit command and environment contract
        run: flags2env audit --config .cli-flags.toml
      - name: Generate shell completion contract
        run: flags2env generate bash --config .cli-flags.toml >/dev/null
