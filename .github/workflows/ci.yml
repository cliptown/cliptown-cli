name: CLI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: cliptown-cli
      - uses: actions/checkout@v4
        with:
          repository: cliptown/cliptown-clients
          ref: main
          path: cliptown-clients
      - uses: actions/checkout@v4
        with:
          repository: cliptown/cliptown-interfaces
          ref: main
          path: cliptown-interfaces
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux clipboard and keyring headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libsecret-1-dev libdbus-1-dev pkg-config
      - name: Verify locked dependency graph
        working-directory: cliptown-cli
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Check formatting
        working-directory: cliptown-cli
        run: cargo fmt --check
      - name: Run Clippy
        working-directory: cliptown-cli
        run: cargo clippy --locked --all-targets --message-format=short -- -D warnings
      - name: Run all-target tests
        working-directory: cliptown-cli
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --locked --all-targets -- --nocapture
      - name: Build release binary
        working-directory: cliptown-cli
        run: cargo build --locked --release

  flags-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned flags2env
        run: ./scripts/install-flags2env.sh
      - name: Audit command and environment contract
        id: flags_audit
        continue-on-error: true
        run: flags2env audit --config .cli-flags.toml > flags-audit.txt 2>&1
      - name: Upload flags audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-flags-audit
          path: flags-audit.txt
          if-no-files-found: error
      - name: Enforce flags audit result
        if: steps.flags_audit.outcome == 'failure'
        run: cat flags-audit.txt && exit 1
      - name: Generate shell completion contract
        run: flags2env generate bash --config .cli-flags.toml >/dev/null
