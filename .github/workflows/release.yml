name: Release CLI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cliptown-cli
            asset_name: cliptown-cli-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: cliptown-cli
            asset_name: cliptown-cli-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: cliptown-cli.exe
            asset_name: cliptown-cli-windows-x86_64.exe

    steps:
      - name: Checkout cliptown-cli
        uses: actions/checkout@v4
        with:
          path: cliptown-cli

      - name: Checkout cliptown-clients
        uses: actions/checkout@v4
        with:
          repository: cliptown/cliptown-clients
          path: cliptown-clients

      - name: Checkout cliptown-interfaces
        uses: actions/checkout@v4
        with:
          repository: cliptown/cliptown-interfaces
          path: cliptown-interfaces

      - name: Setup Protoc
        uses: arduino/setup-protoc@v3

      - name: Build binary
        working-directory: cliptown-cli
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: cliptown-cli/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}
