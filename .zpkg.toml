[package]
org = "cliptown"
name = "cliptown-cli"
version = "0.1.0"
description = "Private command-line clipboard and ClipTown API client"
license = "MIT"
keywords = ["cli", "clipboard", "sync", "rust", "global-tool"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/cliptown/cliptown-cli"

[dependencies]
"cliptown/cliptown-clients" = "^0.1.0"
"cliptown/cliptown-interfaces" = "^0.1.0"
# Keep this draft blocked until cliptown-monorepo#15 creates and publishes it.
"cliptown/cliptown-lib" = "^0.1.0"

[build]
command = "cargo build --release --locked --bin cliptown-core"
outputs = ["target/release/cliptown-core"]

[bin]
cliptown = "target/release/cliptown-core"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/cliptown-core\" && \"$ZED_PKG_TEST_TARGET/target/release/cliptown-core\" --help >/dev/null"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[install]
adapter = "none"

[scripts]
test = "cargo test --all-targets --locked"
