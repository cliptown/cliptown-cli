[package]
name = "cliptown-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cliptown/cliptown-cli"

[[bin]]
name = "cliptown-core"
path = "src/main.rs"

[dependencies]
arboard = "3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cliptown-client-rust = { git = "https://github.com/cliptown/cliptown-clients", rev = "5c92f27f61be656408ffbc9822553387d2f648d4", package = "cliptown-client-rust" }
cliptown-interfaces-rust = { git = "https://github.com/cliptown/cliptown-interfaces", rev = "4782f0fbdaa2e4d4fdcbd637563c29d476f93f67", package = "cliptown-interfaces-rust" }
directories = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ores-clis-core = { git = "https://github.com/ORESoftware/ores-clis-core.git", rev = "2ea696bd8dd066483d29c37af9e34036cbae82f9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
