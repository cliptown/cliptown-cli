[package]
name = "cliptown-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cliptown/cliptown-cli"

[[bin]]
name = "cliptown-core"
path = "src/main.rs"

[dependencies]
arboard = "3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cliptown-client-rust = { path = "../cliptown-clients/clients/rust" }
cliptown-interfaces-rust = { path = "../cliptown-interfaces/generated/rust" }
directories = "6"
flags2env = { git = "https://github.com/ORESoftware/flags-2-env.git", rev = "377bff1a4e7424eb98377997a232ddc0fc700f59" }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
